{% extends 'base.html' %}

{% load static %}

{% block content %}
<h2>Edit Booking</h2>
<div class="container px-5">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-info">Save Changes</button>
    </form>
</div>

<a href="{% url 'booking_list' %}" class="btn btn-secondary">Back to Bookings</a>
{% endblock %}
