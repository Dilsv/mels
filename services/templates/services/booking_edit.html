{% extends 'base.html' %}

{% load static %}

{% block content %}
<h2 class="heading mt-5">Edit Booking</h2>
<div class="container px-5">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-color ms-auto me-1">Save Changes</button>
    </form>
</div>

<a href="{% url 'booking_list' %}" class="btn btn-color me-5 ms-5 mt-5">Back to Bookings</a>
{% endblock %}
